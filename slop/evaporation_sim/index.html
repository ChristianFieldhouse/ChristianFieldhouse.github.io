<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Evaporation Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="container">
        <canvas id="simCanvas"></canvas>
        <div id="controls">
            <div class="control-group">
                <h3>Materials</h3>
                <button id="btn-water" class="active" onclick="setTool(2)">Water</button>
                <button id="btn-wall" onclick="setTool(1)">Wall</button>
                <button id="btn-erase" onclick="setTool(0)">Erase</button>
            </div>

            <div class="control-group">
                <h3>Physics Parameters</h3>
                <label>
                    Gravity
                    <input type="range" id="param-gravity" min="0" max="2" step="0.1" value="0.5">
                </label>
                <label>
                    Surface Tension (Cohesion)
                    <input type="range" id="param-cohesion" min="0" max="5" step="0.1" value="1.0">
                </label>
                <label>
                    Wall Adhesion
                    <input type="range" id="param-adhesion" min="0" max="5" step="0.1" value="1.0">
                </label>
                <label>
                    Evaporation Rate
                    <input type="range" id="param-evap" min="0" max="0.1" step="0.001" value="0.005">
                </label>
                <label>
                    Temperature (activity)
                    <input type="range" id="param-temp" min="0.1" max="5" step="0.1" value="1.0">
                </label>
            </div>
            <div class="control-group">
                <button id="btn-reset">Reset</button>
                <button id="btn-pause">Pause</button>
            </div>
            <div id="stats">
                Steps: <span id="steps-count">0</span>
            </div>
        </div>
    </div>
    <script src="simulation.js"></script>
</body>

</html>
